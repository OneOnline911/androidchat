name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android_main.py.gz.b64"
      - "requirements.txt"
      - "AndroidChat.pyproject"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore application source
        run: base64 -d android_main.py.gz.b64 | gzip -d > main.py

      - name: Install host tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6==6.10.1" qtpip anthropic packaging
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            unzip \
            zip \
            libdouble-conversion3 \
            libmd4c0 \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libfontconfig1 \
            libdbus-1-3

      - name: Download Android PySide wheels
        run: |
          mkdir -p android-wheels
          cd android-wheels
          qtpip download "PySide6==6.10.1" --android --arch aarch64
          ls -lah
          test -n "$(find . -maxdepth 1 -type f -iname 'PySide6-*android*aarch64*.whl' -print -quit)"
          test -n "$(find . -maxdepth 1 -type f -iname 'shiboken6-*android*aarch64*.whl' -print -quit)"

      - name: Prepare Android SDK and NDK
        run: |
          git clone --depth 1 --branch 6.10.1 https://code.qt.io/pyside/pyside-setup.git /tmp/pyside-setup
          python -m pip install -r /tmp/pyside-setup/tools/cross_compile_android/requirements.txt
          python -m pip install packaging
          python /tmp/pyside-setup/tools/cross_compile_android/main.py --download-only --skip-update --auto-accept-license

      - name: Build ARM64 debug APK
        shell: bash
        run: |
          PYSIDE_WHEEL=$(find "$GITHUB_WORKSPACE/android-wheels" -type f -iname 'PySide6-*android*aarch64*.whl' | head -n 1)
          SHIBOKEN_WHEEL=$(find "$GITHUB_WORKSPACE/android-wheels" -type f -iname 'shiboken6-*android*aarch64*.whl' | head -n 1)
          echo "PySide wheel: $PYSIDE_WHEEL"
          echo "Shiboken wheel: $SHIBOKEN_WHEEL"
          test -n "$PYSIDE_WHEEL"
          test -n "$SHIBOKEN_WHEEL"
          pyside6-android-deploy -f -v --name AndroidChat --wheel-pyside "$PYSIDE_WHEEL" --wheel-shiboken "$SHIBOKEN_WHEEL" --keep-deployment-files
          find . -type f \( -name '*.apk' -o -name '*.aab' \) -print

      - name: Collect APK
        if: success()
        run: |
          mkdir -p dist
          find . -type f -name '*.apk' -exec cp -v {} dist/ \;
          test -n "$(find dist -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidChat-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload deployment diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidChat-build-diagnostics
          path: |
            pysidedeploy.spec
            buildozer.spec
            .buildozer/**
          if-no-files-found: ignore
          retention-days: 7
