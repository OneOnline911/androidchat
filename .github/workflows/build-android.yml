name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android_main.py.gz.b64"
      - "requirements.txt"
      - "AndroidChat.pyproject"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore application source
        run: base64 -d android_main.py.gz.b64 | gzip -d > main.py

      - name: Install host tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6==6.10.1" anthropic packaging
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            unzip \
            zip \
            wget \
            libdouble-conversion3 \
            libmd4c0 \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libfontconfig1 \
            libdbus-1-3

      - name: Download public Android PySide wheels
        run: |
          mkdir -p android-wheels
          cd android-wheels
          wget -q --show-progress https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.10.1-6.10.1-cp311-cp311-android_aarch64.whl
          wget -q --show-progress https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.10.1-6.10.1-cp311-cp311-android_aarch64.whl
          test -f PySide6-6.10.1-6.10.1-cp311-cp311-android_aarch64.whl
          test -f shiboken6-6.10.1-6.10.1-cp311-cp311-android_aarch64.whl

      - name: Prepare Android SDK and NDK
        run: |
          git clone --depth 1 --branch 6.10.1 https://code.qt.io/pyside/pyside-setup.git /tmp/pyside-setup
          python -m pip install -r /tmp/pyside-setup/tools/cross_compile_android/requirements.txt
          python /tmp/pyside-setup/tools/cross_compile_android/main.py --download-only --skip-update --auto-accept-license
          test -d "$HOME/.pyside6_android_deploy/android-sdk"
          test -d "$HOME/.pyside6_android_deploy/android-ndk/android-ndk-r27c"

      - name: Verify deploy CLI and inputs
        shell: bash
        run: |
          set -euxo pipefail
          pyside6-android-deploy --help
          test -f main.py
          test -f "$GITHUB_WORKSPACE/android-wheels/PySide6-6.10.1-6.10.1-cp311-cp311-android_aarch64.whl"
          test -f "$GITHUB_WORKSPACE/android-wheels/shiboken6-6.10.1-6.10.1-cp311-cp311-android_aarch64.whl"
          test -d "$HOME/.pyside6_android_deploy/android-sdk"
          test -d "$HOME/.pyside6_android_deploy/android-ndk/android-ndk-r27c"

      - name: Build ARM64 debug APK
        shell: bash
        run: |
          set -euxo pipefail
          pyside6-android-deploy \
            --name="AndroidChat" \
            --wheel-pyside="$GITHUB_WORKSPACE/android-wheels/PySide6-6.10.1-6.10.1-cp311-cp311-android_aarch64.whl" \
            --wheel-shiboken="$GITHUB_WORKSPACE/android-wheels/shiboken6-6.10.1-6.10.1-cp311-cp311-android_aarch64.whl" \
            --sdk-path="$HOME/.pyside6_android_deploy/android-sdk" \
            --ndk-path="$HOME/.pyside6_android_deploy/android-ndk/android-ndk-r27c" \
            --keep-deployment-files \
            --force \
            --verbose
          find . -type f \( -name '*.apk' -o -name '*.aab' \) -print

      - name: Collect APK
        if: success()
        run: |
          mkdir -p dist
          find . -type f -name '*.apk' -exec cp -v {} dist/ \;
          test -n "$(find dist -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidChat-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload deployment diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidChat-build-diagnostics
          path: |
            pysidedeploy.spec
            buildozer.spec
            .buildozer/**
          if-no-files-found: ignore
          retention-days: 7
