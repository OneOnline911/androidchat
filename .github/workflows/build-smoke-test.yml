name: Build Qt Smoke Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "smoke_main.py"
      - ".github/workflows/build-smoke-test.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Prepare isolated smoke-test source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p smoke-test
          cp smoke_main.py smoke-test/main.py
          cat > smoke-test/SmokeTest.pyproject <<'EOF'
          {
              "files": ["main.py"]
          }
          EOF

      - name: Install host tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6==6.10.1" packaging
          sudo apt-get update
          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libtool \
            libssl-dev \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            python3-dev \
            unzip \
            zip \
            wget \
            libdouble-conversion3 \
            libmd4c0 \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libfontconfig1 \
            libdbus-1-3

      - name: Download public Android PySide wheels
        run: |
          mkdir -p android-wheels
          cd android-wheels
          wget -q --show-progress https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.10.1-6.10.1-cp311-cp311-android_aarch64.whl
          wget -q --show-progress https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.10.1-6.10.1-cp311-cp311-android_aarch64.whl
          test -f PySide6-6.10.1-6.10.1-cp311-cp311-android_aarch64.whl
          test -f shiboken6-6.10.1-6.10.1-cp311-cp311-android_aarch64.whl

      - name: Prepare Android SDK and NDK
        run: |
          git clone --depth 1 --branch 6.10.1 https://code.qt.io/pyside/pyside-setup.git /tmp/pyside-setup
          python -m pip install -r /tmp/pyside-setup/tools/cross_compile_android/requirements.txt
          python -m pip install -r /tmp/pyside-setup/sources/pyside-tools/requirements-android.txt
          python /tmp/pyside-setup/tools/cross_compile_android/main.py --download-only --skip-update --auto-accept-license
          test -d "$HOME/.pyside6_android_deploy/android-sdk"
          test -d "$HOME/.pyside6_android_deploy/android-ndk/android-ndk-r27c"

      - name: Verify deploy CLI and inputs
        shell: bash
        run: |
          set -euxo pipefail
          pyside6-android-deploy --help
          test -f "$GITHUB_WORKSPACE/smoke-test/main.py"
          test -f "$GITHUB_WORKSPACE/smoke-test/SmokeTest.pyproject"
          test -f "$GITHUB_WORKSPACE/android-wheels/PySide6-6.10.1-6.10.1-cp311-cp311-android_aarch64.whl"
          test -f "$GITHUB_WORKSPACE/android-wheels/shiboken6-6.10.1-6.10.1-cp311-cp311-android_aarch64.whl"

      - name: Build isolated ARM64 smoke-test APK
        shell: bash
        working-directory: smoke-test
        run: |
          set -uo pipefail
          pyside6-android-deploy \
            --name="QtSmokeTest" \
            --wheel-pyside="$GITHUB_WORKSPACE/android-wheels/PySide6-6.10.1-6.10.1-cp311-cp311-android_aarch64.whl" \
            --wheel-shiboken="$GITHUB_WORKSPACE/android-wheels/shiboken6-6.10.1-6.10.1-cp311-cp311-android_aarch64.whl" \
            --sdk-path="$HOME/.pyside6_android_deploy/android-sdk" \
            --ndk-path="$HOME/.pyside6_android_deploy/android-ndk/android-ndk-r27c" \
            --keep-deployment-files \
            --force \
            --verbose 2>&1 | tee android-smoke-build.log
          deploy_rc=${PIPESTATUS[0]}
          echo "pyside6-android-deploy exit code: $deploy_rc"
          if grep -q '^Exception occurred:' android-smoke-build.log; then
            echo "PySide Android deploy swallowed an internal exception; failing explicitly."
            exit 1
          fi
          if [ "$deploy_rc" -ne 0 ]; then
            exit "$deploy_rc"
          fi
          apk="$(find "$GITHUB_WORKSPACE/smoke-test" "$HOME" -type f -name '*.apk' -print -quit 2>/dev/null)"
          if [ -z "$apk" ]; then
            echo "No smoke-test APK was produced."
            exit 1
          fi

      - name: Collect and inspect APK
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist-smoke
          apk="$(find "$GITHUB_WORKSPACE/smoke-test" "$HOME" -type f -name '*.apk' -print -quit 2>/dev/null)"
          test -n "$apk"
          cp -v "$apk" dist-smoke/QtSmokeTest-debug.apk
          "$HOME/.pyside6_android_deploy/android-sdk/build-tools/35.0.0/aapt" dump badging dist-smoke/QtSmokeTest-debug.apk | tee dist-smoke/apk-badging.txt

      - name: Upload smoke-test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QtSmokeTest-apk
          path: |
            dist-smoke/QtSmokeTest-debug.apk
            dist-smoke/apk-badging.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload smoke-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: QtSmokeTest-build-diagnostics
          path: |
            smoke-test/android-smoke-build.log
            smoke-test/pysidedeploy.spec
            smoke-test/buildozer.spec
            smoke-test/.buildozer/**
          if-no-files-found: ignore
          retention-days: 7
