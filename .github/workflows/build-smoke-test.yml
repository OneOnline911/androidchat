name: Build Modern Qt Smoke Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "smoke_main.py"
      - ".github/workflows/build-smoke-test.yml"

env:
  PYSIDE_VERSION: "6.11.2"
  TARGET_PYTHON_VERSION: "3.11.16"
  P4A_REF: "v2026.05.09"
  ANDROID_API: "36"
  ANDROID_MIN_API: "28"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "29.0.14206865"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Prepare isolated smoke-test source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p smoke-test
          cp smoke_main.py smoke-test/main.py
          cat > smoke-test/SmokeTest.pyproject <<'EOF'
          {
              "files": ["main.py"]
          }
          EOF

      - name: Install host tools
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install "PySide6==${PYSIDE_VERSION}" packaging
          sudo apt-get update
          sudo apt-get install -y ant autoconf automake autopoint ccache cmake g++ gcc git lbzip2 libffi-dev libltdl-dev libtool libssl-dev make openjdk-17-jdk patch pkg-config python3-dev unzip zip wget binutils libdouble-conversion3 libmd4c0 libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Download public Android PySide wheels
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p android-wheels
          cd android-wheels
          wget -q --show-progress "https://download.qt.io/official_releases/QtForPython/pyside6/pyside6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"
          wget -q --show-progress "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"
          test -f "pyside6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"
          test -f "shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl"

      - name: Prepare current Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "${PYSIDE_VERSION}" https://code.qt.io/pyside/pyside-setup.git /tmp/pyside-setup
          python -m pip install -r /tmp/pyside-setup/tools/cross_compile_android/requirements.txt
          python -m pip install -r /tmp/pyside-setup/sources/pyside-tools/requirements-android.txt
          python /tmp/pyside-setup/tools/cross_compile_android/main.py --download-only --skip-update --auto-accept-license

          sdk_root="$HOME/.pyside6_android_deploy/android-sdk"
          test -d "$sdk_root"

          cli_zip=/tmp/commandlinetools-linux-15859902_latest.zip
          wget -q --show-progress "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -O "$cli_zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $cli_zip" | sha256sum -c -
          rm -rf /tmp/android-cli "$sdk_root/cmdline-tools/latest"
          mkdir -p /tmp/android-cli "$sdk_root/cmdline-tools/latest"
          unzip -q "$cli_zip" -d /tmp/android-cli
          cp -a /tmp/android-cli/cmdline-tools/. "$sdk_root/cmdline-tools/latest/"

          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --sdk_root="$sdk_root" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          test -d "$sdk_root/platforms/android-${ANDROID_API}"
          test -x "$sdk_root/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
          test -x "$sdk_root/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

      - name: Pin Android target and Python runtime
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import os
          import site
          from pathlib import Path
          candidates = []
          roots = [Path(p) for p in site.getsitepackages()]
          user_site = site.getusersitepackages()
          if user_site:
              roots.append(Path(user_site))
          for root in roots:
              if root.exists():
                  candidates.extend(root.rglob("deploy_lib/android/buildozer.py"))
          candidates = [p for p in candidates if "PySide6" in str(p)]
          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one PySide6 buildozer helper, found: {candidates}")
          path = candidates[0]
          text = path.read_text()
          replacements = {
              'self.set_value("app", "requirements", "python3,shiboken6,PySide6")': f'self.set_value("app", "requirements", "python3=={os.environ["TARGET_PYTHON_VERSION"]},hostpython3=={os.environ["TARGET_PYTHON_VERSION"]},shiboken6,PySide6")',
              'self.set_value("app", "p4a.branch", "develop")': f'self.set_value("app", "p4a.branch", "{os.environ["P4A_REF"]}")',
              'self.set_value("app", "android.archs", pysidedeploy_config.arch)': 'self.set_value("app", "android.archs", pysidedeploy_config.arch)\n' + f'        self.set_value("app", "android.api", "{os.environ["ANDROID_API"]}")\n' + f'        self.set_value("app", "android.minapi", "{os.environ["ANDROID_MIN_API"]}")',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Patch anchor count for {old!r} is {count}, expected 1")
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Verify deploy CLI and inputs
        shell: bash
        run: |
          set -euxo pipefail
          pyside6-android-deploy --help
          test -f "$GITHUB_WORKSPACE/smoke-test/main.py"
          test -f "$GITHUB_WORKSPACE/smoke-test/SmokeTest.pyproject"

      - name: Build isolated modern ARM64 smoke-test APK
        shell: bash
        working-directory: smoke-test
        env:
          LDFLAGS: "-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
        run: |
          set -uo pipefail
          rm -rf deployment .buildozer bin
          pyside6-android-deploy \
            --name="QtSmokeModern" \
            --wheel-pyside="$GITHUB_WORKSPACE/android-wheels/pyside6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl" \
            --wheel-shiboken="$GITHUB_WORKSPACE/android-wheels/shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_aarch64.whl" \
            --sdk-path="$HOME/.pyside6_android_deploy/android-sdk" \
            --ndk-path="$HOME/.pyside6_android_deploy/android-sdk/ndk/${ANDROID_NDK_VERSION}" \
            --keep-deployment-files \
            --force \
            --verbose 2>&1 | tee android-smoke-build.log
          deploy_rc=${PIPESTATUS[0]}
          if grep -q '^Exception occurred:' android-smoke-build.log; then exit 1; fi
          if [ "$deploy_rc" -ne 0 ]; then exit "$deploy_rc"; fi
          apk="$(find "$GITHUB_WORKSPACE/smoke-test" "$HOME" -type f -name '*.apk' -print -quit 2>/dev/null)"
          test -n "$apk"

      - name: Validate modern APK contract
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist-smoke unpacked-smoke
          apk="$(find "$GITHUB_WORKSPACE/smoke-test" "$HOME" -type f -name '*.apk' -print -quit 2>/dev/null)"
          test -n "$apk"
          cp -v "$apk" dist-smoke/QtSmokeModern-debug.apk
          aapt="$HOME/.pyside6_android_deploy/android-sdk/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
          "$aapt" dump badging dist-smoke/QtSmokeModern-debug.apk | tee dist-smoke/apk-badging.txt
          grep -q "compileSdkVersion='${ANDROID_API}'" dist-smoke/apk-badging.txt
          grep -q "targetSdkVersion:'${ANDROID_API}'" dist-smoke/apk-badging.txt
          grep -q "sdkVersion:'${ANDROID_MIN_API}'" dist-smoke/apk-badging.txt
          grep -q "native-code: 'arm64-v8a'" dist-smoke/apk-badging.txt
          unzip -q dist-smoke/QtSmokeModern-debug.apk -d unpacked-smoke
          test -f "unpacked-smoke/lib/arm64-v8a/libpython3.11.so"
          if find unpacked-smoke -type f -name 'libpython3.14.so' | grep -q .; then exit 1; fi
          {
            echo "Expected target Python: ${TARGET_PYTHON_VERSION}"
            echo "Expected Android API: ${ANDROID_API}"
            echo "Expected min API: ${ANDROID_MIN_API}"
            echo "Expected NDK: ${ANDROID_NDK_VERSION}"
            echo
            echo "ELF LOAD alignment below 16 KB:"
            bad=0
            while IFS= read -r so; do
              if ! readelf -h "$so" >/dev/null 2>&1; then
                continue
              fi
              min_align="$(readelf -lW "$so" | awk '$1 == "LOAD" {print $NF}' | sort -n | head -n 1)"
              if [ -n "$min_align" ] && [ "$((min_align))" -lt 16384 ]; then
                printf '%s %s\n' "${so#unpacked-smoke/}" "$min_align"
                bad=$((bad + 1))
              fi
            done < <(find unpacked-smoke/lib/arm64-v8a -type f -name '*.so' | sort)
            echo "Count below 16 KB: $bad"
            test "$bad" -eq 0
          } | tee dist-smoke/runtime-validation.txt
          sha256sum dist-smoke/QtSmokeModern-debug.apk | tee dist-smoke/sha256.txt

      - name: Upload modern smoke-test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QtSmokeModern-apk
          path: |
            dist-smoke/QtSmokeModern-debug.apk
            dist-smoke/apk-badging.txt
            dist-smoke/runtime-validation.txt
            dist-smoke/sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload smoke-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: QtSmokeModern-build-diagnostics
          path: |
            smoke-test/android-smoke-build.log
            smoke-test/pysidedeploy.spec
            smoke-test/buildozer.spec
            smoke-test/.buildozer/**
          if-no-files-found: ignore
          retention-days: 7
